<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clues on Tues Quiz 1.1.2</title>

  <style>
    #correctAnswers p {
  margin: 3px 0;      /* MUCH tighter */
  line-height: 1.2;   /* optional: reduces vertical height */
  font-size: 1.2rem;  /* optional: slightly smaller text */
}
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f5f9ff;
      margin: 0;
      
      padding: 0;
      opacity: 0;
      animation: fadeInBody 0.8s ease forwards;
    }
    #confettiContainer {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: hidden;
      z-index: 9999; 
}

.confetti {
  position: absolute;
  font-size: 2rem;
  animation: fall 1.5s linear forwards;
  opacity: 0.9;
}

@keyframes fall {
  0% {
    transform: translateY(-50px) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translateY(100vh) rotate(360deg);
    opacity: 0;
  }
}

@media (max-width: 600px) {
  .container {
    width: 92%;
    padding: 20px;
    margin: 20px auto;
  }

  h1 {
    font-size: 1.6rem;
  }

  input[type="text"] {
    width: 100%;
    font-size: 0.95rem;
    padding: 8px;
  }

  button {
    font-size: 1rem;
    padding: 12px;
  }

  .tile {
    width: 28px;
    height: 28px;
    font-size: 0.9rem;
  }
    button[type="submit"] {
    font-size: 0.92rem;
    padding: 10px 12px;
    width: 100%;
  }
}

    @keyframes fadeInBody {
      from { opacity: 0; }
      to { opacity: 1; }
    }

.container {
  max-width: 700px;
  width: 95%;              /* scales beautifully on phones */
  margin: 30px auto;
  background: white;
  padding: 20px;           /* smaller padding on mobile */
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  animation: fadeSlideIn 0.8s ease forwards;
  opacity: 0;
  transform: translateY(20px);
}

    @keyframes fadeSlideIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      text-align: center;
      color: #0a4dbf;
      margin-bottom: 30px;
      font-size: 2rem;
      letter-spacing: 1px;
      animation: fadeInHeader 1s ease forwards;
      opacity: 0;
    }

    @keyframes fadeInHeader {
      to { opacity: 1; }
    }

    .question {
      margin-bottom: 25px;
      opacity: 0;
      transform: translateY(15px);
      animation: questionSlideIn 0.6s ease forwards;
    }

    .question:nth-child(1) { animation-delay: 0.2s; }
    .question:nth-child(2) { animation-delay: 0.3s; }
    .question:nth-child(3) { animation-delay: 0.4s; }
    .question:nth-child(4) { animation-delay: 0.5s; }
    .question:nth-child(5) { animation-delay: 0.6s; }
    .question:nth-child(6) { animation-delay: 0.7s; }
    .question:nth-child(7) { animation-delay: 0.8s; }
    .question:nth-child(8) { animation-delay: 0.9s; }
    .question:nth-child(9) { animation-delay: 1.0s; }
    .question:nth-child(10) { animation-delay: 1.1s; }

    @keyframes questionSlideIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    input[type="text"] {
      width: 95%;
      padding: 12px;
      font-size: 1rem;
      border: 2px solid #dce6ff;
      border-radius: 8px;
      transition: 0.25s;
    }

    input[type="text"]:focus {
      border-color: #0a4dbf;
      outline: none;
      box-shadow: 0 0 8px rgba(10,77,191,0.3);
      transform: scale(1.02);
    }

    button {
      width: 100%;
      padding: 14px;
      background: #0a4dbf;
      color: white;
      font-size: 1.1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
      transition: 0.25s;
      animation: fadeInButton 1.2s ease forwards;
      opacity: 0;
    }

    @keyframes fadeInButton {
      to { opacity: 1; }
    }

    button:hover {
      background: #083a8f;
      box-shadow: 0 0 10px rgba(10,77,191,0.4);
      transform: scale(1.03);
    }

    /* POPUP OVERLAY */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.45);
      display: none;
      justify-content: center;
      align-items: center;
      animation: fadeInOverlay 0.3s ease forwards;
    }

    @keyframes fadeInOverlay {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* POPUP BOX */
.popup {
  background: white;
  padding: 10px 10px;       /* tighter padding */
  width: 90%;
  max-width: 350px;
  border-radius: 10px;
  text-align: center;
  box-shadow: 0 6px 25px rgba(0,0,0,0.2);
    overflow-y: auto;
  max-height: 80vh;
}
.tile.yellow {
  background: #fbc02d; /* VAR yellow */
}




    @keyframes popupIn {
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .tiles {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 2px;
      margin: 14px auto;
      max-width: 250px;
    }

    .tile {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      background: #dce6ff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      color: white;
      font-size: 1.1rem;
      animation: tilePop 0.3s ease;
    }

    @keyframes tilePop {
      from { transform: scale(0.6); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .tile.green { background: #4caf50; }
    .tile.red { background: #e53935; }

.close-btn {
  display: block;
  width: 100%;
  margin: 6px 0;        /* was likely 15–20px */
  padding: 6px 0;      /* keeps button height comfortable */
  background-color: #3b4edc;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
    .var-popup {
  background: white;
  padding: 12px;
  border-radius: 10px;
  text-align: center;
  margin-top: 10px;
  border: 2px solid #0a4dbf;
}

.var-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  margin-top: 10px;
}

.var-square {
  background: #e3e3e3;
  padding: 6px 0;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.2s;
}

.var-square:hover {
  background: #cfcfcf;
}


    .close-btn:hover {
      background: #083a8f;
    }


/* Rocket mission result overlay: works on mobile and desktop. */
.rocket-launch-btn{background:#17387b!important;color:#fff6d3!important;border:2px solid #edbb56!important;font-weight:800!important;opacity:1!important;animation:none!important;margin:12px 0 8px!important}
.rocket-modal{position:fixed;z-index:20000;inset:0;background:#080f26;display:flex;flex-direction:column;overflow:hidden}
.rocket-modal[hidden]{display:none!important}
.rocket-modal-header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;background:#132b5a;color:#fff1bd;font-size:clamp(12px,3vw,17px);flex-shrink:0}
.rocket-modal-header .rocket-back{margin:0;padding:9px 11px;width:auto;opacity:1;animation:none;font-size:12px;border:2px solid #7699d5;background:#1c4079;flex-shrink:0}
#rocketIframe{width:100%;flex:1;min-height:0;border:0;background:#080f26}
body.rocket-open{overflow:hidden}
@media(max-width:600px){.rocket-modal-header{padding:7px 9px}.rocket-modal-header .rocket-back{padding:8px;font-size:11px}}

  </style>
</head>

<body>
  <div class="container">
<img src="logo.png" alt="CluesOnTues Logo"
     style="max-width:100%; height:auto; display:block; margin:0 auto 20px auto;">



    <form id="quizForm">
      <h2 id="themeTitle" style="text-align:center; color:#0a4dbf; margin-bottom:20px;"></h2>

    <div id="questionsContainer"></div>

      <button type="submit">Submit Answers</button>
    </form>
  </div>
<div id="confettiContainer"></div>
  <!-- POPUP -->
  <div class="overlay" id="overlay">
    <div class="popup">
      <h2>Your Score</h2>
      <p id="scoreText"></p>
       <p id="rocketLevelDescription" style="font-size:0.9rem;color:#164d96"></p>
       <button class="rocket-launch-btn" type="button" onclick="launchScoreRocket()">🚀 Launch My Score</button>

      <div class="tiles" id="tiles"></div>
      <div id="correctAnswers" style="margin-top:8px; text-align:left;"></div>
<div id="varPopup" class="var-popup" style="display:none;">
  <h3>VAR Review</h3>
  <p>Select a question:</p>
  <div id="varQuestionGrid" class="var-grid"></div>

  <div id="varActions" style="display:none; margin-top:10px;">
    <button class="close-btn" onclick="applyVar('misspelled')">I Misspelled That!</button>
    <button class="close-btn" onclick="applyVar('contested')">I’m Contesting That!</button>
  </div>
</div>


      <button class="close-btn" onclick="openVAR()">VAR</button>
<button class="close-btn" onclick="shareResult()">Share Result</button>
<button class="close-btn" onclick="closePopup()">Close</button>
<p id="copyConfirm" style="display:none; margin-top:6px; color:#0a4dbf; font-weight:bold;">
  Copied to clipboard!
</p>


    </div>
  </div>

<div id="rocketModal" class="rocket-modal" hidden role="dialog" aria-modal="true" aria-label="Your rocket mission">
 <div class="rocket-modal-header"><strong id="rocketScoreLabel">🚀 Your Rocket Mission</strong><button type="button" onclick="closeScoreRocket()" class="rocket-back">✕ BACK TO QUIZ</button></div>
 <iframe id="rocketIframe" title="Animated rocket mission based on quiz score" allow="autoplay"></iframe>
</div>
<script>

const ROCKET_HTML = "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Pixel Rocket \u2014 Choose Your Mission<\/title>\n<style>\n:root{color-scheme:dark}\n*{box-sizing:border-box}\nbody{\n  margin:0;min-height:100vh;display:grid;place-items:center;\n  background:radial-gradient(circle at 50% 30%,#17346d 0%,#09132c 72%);\n  color:#e4efff;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;padding:18px;\n}\n.wrap{width:min(96vw,900px)}\n.layout{display:grid;grid-template-columns:minmax(280px,650px) minmax(200px,260px);gap:18px;align-items:start}\n.frame{\n  position:relative;aspect-ratio:1;overflow:hidden;\n  border:5px solid #29488c;box-shadow:0 0 0 3px #0a1637,0 24px 90px #000a;background:#071535;\n}\ncanvas{width:100%;height:100%;display:block;image-rendering:pixelated}\n/* Big milestone signs appear over the rocket, then drop below the camera. */\n.milestone{\n  position:absolute;left:0;top:50%;width:100%;z-index:5;\n  display:flex;justify-content:center;align-items:center;pointer-events:none;\n  padding:0 16px;text-align:center;\n  will-change:transform,opacity;\n}\n.milestone span{\n  display:block;max-width:100%;background:#101d46ed;border:4px solid #f1c676;\n  box-shadow:5px 5px 0 #071127, inset 0 0 0 2px #81583f;\n  padding:12px 14px;color:#ffecb6;text-shadow:3px 3px 0 #7c3b4b;\n  font-size:clamp(18px,3.35vw,28px);font-weight:900;line-height:1.18;letter-spacing:1px;\n  text-transform:uppercase;\n}\n.hud{\n  position:absolute;inset:0;pointer-events:none;padding:4%;\n  display:flex;flex-direction:column;justify-content:space-between;\n  text-shadow:2px 2px #07142c;font-size:clamp(9px,1.8vw,14px);letter-spacing:1px\n}\n.topbar{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}\n.badge{color:#9dc4ff}\n.status{color:#ffd27d;text-align:right}\n.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}\n.bar{width:100px;height:10px;border:2px solid #a2bbe6;background:#0d2047;display:inline-block;vertical-align:middle;margin-left:6px}\n.fill{height:100%;width:0;background:#ffbb55}\n.panel{\n  background:#0c1738;border:4px solid #29488c;box-shadow:0 0 0 3px #07102a,0 18px 40px #0008;\n  padding:12px 14px 14px;\n}\n.panel h2{margin:0 0 10px;font-size:16px;letter-spacing:1px;color:#fff}\n.panel .sub{font-size:11px;color:#9db5db;margin-bottom:10px}\n.stages{display:grid;gap:6px}\n.stage{\n  padding:7px 8px;border:2px solid #233f78;background:#101d43;color:#94acd4;\n  font-size:12px;line-height:1.15;transition:.12s steps(1,end)\n}\n.stage.active{\n  background:#22458a;color:#fff8d4;border-color:#ffd06d;\n  box-shadow:inset 0 0 0 2px #fff2b2,0 0 12px #ffd06d40\n}\n.stage.done{background:#182f5f;color:#c9dbff;border-color:#5074bd}\n.controls{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:14px}\nbutton{\n  border:2px solid #7296da;background:#1b3569;color:white;padding:11px 16px;\n  font:700 12px ui-monospace,monospace;letter-spacing:1px;cursor:pointer;box-shadow:4px 4px 0 #070e24\n}\nbutton:hover{background:#3157a1}\nbutton:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #070e24}\nsmall{display:block;color:#9eb5dc;line-height:1.45}\n/* Launch choice and end screens */\n.overlay{position:absolute;inset:0;z-index:12;background:#06122bdc;display:flex;align-items:center;justify-content:center;padding:18px;text-align:center}\n.overlay[hidden]{display:none}\n[hidden]{display:none!important}\n.dialog{width:min(100%,370px);padding:20px 16px;background:#10224a;border:4px solid #f4cf7d;box-shadow:7px 7px 0 #050d20,inset 0 0 0 3px #274f88}\n.dialog h2{font-size:clamp(19px,4vw,27px);letter-spacing:1px;color:#ffe3a0;margin:0 0 10px;text-shadow:3px 3px #723943}\n.dialog p{font-size:12px;line-height:1.55;color:#c5d8f7}\n.choice{font:900 23px ui-monospace,monospace;color:#fff1b5;background:#132f63;border:3px solid #769edc;padding:10px;display:block;width:100%;margin:12px 0;cursor:pointer}\n.dialog button{margin:8px auto 0;min-width:155px}\n.end-title{font-size:clamp(17px,3vw,23px)!important}\n@media (max-width:860px){.layout{grid-template-columns:1fr}}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"layout\">\n    <div>\n      <div class=\"frame\">\n        <canvas id=\"scene\" width=\"320\" height=\"320\" aria-label=\"Pixel-art rocket launch through ten stages from takeoff to lightspeed\"><\/canvas>\n        <div class=\"milestone\" id=\"milestone\" aria-live=\"polite\"><span id=\"milestoneText\">TAKE OFF<\/span><\/div>\n        <div class=\"overlay\" id=\"overlay\">\n          <div class=\"dialog\" id=\"dialogStart\">\n            <h2>\u2605 CHOOSE YOUR FLIGHT \u2605<\/h2>\n            <p>Select how far the rocket will travel.<br>0 = rocket explosion. 1\u201310 = stop at that milestone.<\/p>\n            <label for=\"target\" style=\"font-size:12px;color:#ffdc90\">MISSION LEVEL<\/label>\n            <select id=\"target\" class=\"choice\" aria-label=\"Mission level from zero to ten\">\n              <option value=\"0\">0 \u2014 BOOM!<\/option>\n              <option value=\"1\">1 \u2014 TAKE OFF<\/option>\n              <option value=\"2\">2 \u2014 THROUGH THE CLOUDS<\/option>\n              <option value=\"3\">3 \u2014 PAST THE PLANES<\/option>\n              <option value=\"4\">4 \u2014 UPPER ATMOSPHERE<\/option>\n              <option value=\"5\">5 \u2014 REACHING ORBIT<\/option>\n              <option value=\"6\">6 \u2014 HIGHER THAN THE ISS<\/option>\n              <option value=\"7\">7 \u2014 PAST THE MOON<\/option>\n              <option value=\"8\">8 \u2014 THERE GOES MARS<\/option>\n              <option value=\"9\">9 \u2014 PAST PLUTO<\/option>\n              <option value=\"10\">10 \u2014 LIGHTSPEED ACHIEVED<\/option>\n            <\/select>\n            <button id=\"launch\" type=\"button\">\u25b6 LAUNCH ROCKET<\/button>\n          <\/div>\n          <div class=\"dialog\" id=\"dialogEnd\" hidden>\n            <h2 class=\"end-title\" id=\"endTitle\">MISSION COMPLETE!<\/h2>\n            <p id=\"endDescription\">Your rocket has reached its destination.<\/p>\n            <button id=\"again\" type=\"button\">\u21a9 BACK TO RESULTS<\/button>\n          <\/div>\n        <\/div>\n        <div class=\"hud\">\n          <div class=\"topbar\">\n            <span class=\"badge\">\u2605 PIXEL SPACE PROGRAM<\/span>\n            <span class=\"status\" id=\"status\">PREPARE FOR LAUNCH<\/span>\n          <\/div>\n          <div class=\"bottom\">\n            <span>ALT <span id=\"alt\">0000<\/span> KM<\/span>\n            <span>BOOST <span class=\"bar\"><span class=\"fill\" id=\"boost\"><\/span><\/span><\/span>\n          <\/div>\n        <\/div>\n      <\/div>\n      <div class=\"controls\">\n        <small>10 STAGES // FOLLOW CAMERA // PIXEL JOURNEY TO LIGHTSPEED<\/small>\n        <button id=\"replay\" type=\"button\">\u21a9 BACK TO RESULTS<\/button>\n      <\/div>\n    <\/div>\n    <aside class=\"panel\">\n      <h2>MISSION STAGES<\/h2>\n      <div class=\"sub\">Current stage highlights as the rocket climbs.<\/div>\n      <div class=\"stages\" id=\"stageList\"><\/div>\n    <\/aside>\n  <\/div>\n<\/div>\n\n<script>\n(() => {\n'use strict';\nconst stages = [\n  \"1. TAKE OFF\",\n  \"2. THROUGH THE CLOUDS\",\n  \"3. PAST THE PLANES\",\n  \"4. UPPER ATMOSPHERE\",\n  \"5. REACHING ORBIT\",\n  \"6. HIGHER THAN THE ISS\",\n  \"7. PAST THE MOON\",\n  \"8. THERE GOES MARS\",\n  \"9. PAST PLUTO\",\n  \"10. LIGHTSPEED ACHIEVED\"\n];\n// Give the orbital fly-bys enough time to arrive, linger, and drift away.\nconst durations = [1.9,1.7,1.7,1.7,1.7,2.9,2.9,2.9,2.9,2.3];\nconst cumulative = [];\ndurations.reduce((a,b,i)=>cumulative[i]=a+b,0);\nconst totalTime = durations.reduce((a,b)=>a+b,0) + 1.5;\n\nconst scene = document.getElementById('scene');\nconst ctx = scene.getContext('2d');\nctx.imageSmoothingEnabled = false;\nconst stageList = document.getElementById('stageList');\nconst status = document.getElementById('status');\nconst alt = document.getElementById('alt');\nconst boost = document.getElementById('boost');\nconst milestone = document.getElementById('milestone');\nconst milestoneText = document.getElementById('milestoneText');\nconst overlay = document.getElementById('overlay');\nconst dialogStart = document.getElementById('dialogStart');\nconst dialogEnd = document.getElementById('dialogEnd');\nconst targetInput = document.getElementById('target');\nconst endTitle = document.getElementById('endTitle');\nconst endDescription = document.getElementById('endDescription');\nlet destination = 0, mode = 'choose', elapsed = 0, explosionTime = 0;\nconst explosionBits = Array.from({length:110},(_,i)=>{\n  const angle = i*2.39996;\n  return {angle, velocity:17 + (i%11)*8, size:1+(i%4), color:['#fff7d6','#ffe082','#ffb83c','#ff713b','#ba3552','#879acb'][i%6]};\n});\nfunction choose(){\n  mode='choose'; elapsed=0; explosionTime=0; travel=0; smoke=[]; sparks=[]; currentMark=-1;\n  overlay.hidden=false; dialogStart.hidden=false; dialogEnd.hidden=true;\n  milestone.style.opacity='0'; status.textContent='AWAITING ORDERS';\n}\nfunction begin(){\n  destination=Number(targetInput.value);\n  elapsed=0; explosionTime=0; travel=0; smoke=[]; sparks=[];currentMark=-1;\n  mode='flying';overlay.hidden=true;\n}\nfunction finish(){\n  mode='complete'; overlay.hidden=false; dialogStart.hidden=true; dialogEnd.hidden=false;\n  endTitle.textContent=destination===0?'\ud83d\udca5 ROCKET DESTROYED!':'\u2605 MISSION COMPLETE!';\n  endDescription.textContent=destination===0?\n    'Flight level 0: spectacular pixel-art explosion!':\n    `Flight level ${destination} reached: ${stages[destination-1].replace(/^\\d+\\.\\s*/, '')}.`;\n  status.textContent=destination===0?'LAUNCH FAILED':'DESTINATION REACHED';\n  milestone.style.opacity='0';\n}\ndocument.getElementById('launch').addEventListener('click', begin);\ndocument.getElementById('again').addEventListener('   // Camera follows rocket so the rocket stays around the lower-middle/center\n  const rocketWorldY = 246 - distance * 0.09;\n  // Positive scroll value means the takeoff area moves DOWN the screen.\n  const scrollDown = Math.max(0, distance);\n  const cameraTargetY = 196;\n  const rocketScreenY = cameraTargetY - Math.min(74, distance * 0.11);\n\n  // Smoothly blend both sky gradient colours over the whole journey,\n  // rather than snapping to a new sky on stage boundaries.\n  const palettes = [\n    ['#061539','#183779'], ['#071a3d','#1c4184'],\n    ['#071839','#183774'], ['#06152f','#112b60'],\n    ['#041126','#10254f'], ['#030e21','#0c2048'],\n    ['#020a19','#0a1a3c'], ['#020815','#091633'],\n    ['#010610','#07122a'], ['#020712','#061425']\n  ];\n  function mixHex(a,b,f){\n    f=clamp(f,0,1);\n    const ah=a.slice(1),bh=b.slice(1);\n    const v=[0,2,4].map(i=>{\n      const x=parseInt(ah.slice(i,i+2),16);\n      const y=parseInt(bh.slice(i,i+2),16);\n      return Math.round(x+(y-x)*f).toString(16).padStart(2,'0');\n    });\n    return '#'+v.join('');\n  }\n  // Colour targets sit at each stage midpoint, guaranteeing continuity.\n  const mids=durations.map((_,i)=>(i===0?0:cumulative[i-1])+durations[i]/2);\n  let ci=0;\n  while(ci<mids.length-2 && t>mids[ci+1]) ci++;\n  const blend=clamp((t-mids[ci])/(mids[ci+1]-mids[ci]),0,1);\n  const smoothBlend=blend*blend*(3-2*blend);\n  const top=mixHex(palettes[ci][0],palettes[ci+1][0],smoothBlend);\n  const bottom=mixHex(palettes[ci][1],palettes[ci+1][1],smoothBlend);\n\n  const g = ctx.createLinearGradient(0,0,0,H);\n  g.addColorStop(0,top);\n  g.addColorStop(1,bottom);\n  ctx.fillStyle = g;\n  ctx.fillRect(0,0,W,H);\n\n  // Stars\n  for(const s of stars){\n    // Seamless wrap: no more running out of stars. Later stages move MUCH faster.\n    const sy = ((s.y + scrollDown * (0.5 + stage*0.09)) % (H+20) + H+20) % (H+20) - 10;\n    const tw = Math.sin(t*2+s.t)*0.2 + 0.8;\n    block(s.x, sy, s.r, s.r, s.b ? '#d7e4ff' : '# e and ignition near launch\n  if(mode === 'flying' && t > 0.28 && t < 3.2){\n    const count = t < 1.1 ? 4 : 2;\n    for(let i=0;i<count;i++){\n      smoke.push({x:160+rand(-8,8), y:290 + rand(-6,2) + scrollDown, age:0, vx:rand(-18,18), vy:rand(-10,4), size:rand(0.42,0.95)});\n    }\n  }\n  smoke = smoke.filter(p=>p.age<2.7);\n  for(const p of smoke){\n    p.age += dt; p.x += p.vx*dt; p.y += p.vy*dt + 12*dt;\n    const sy = p.y;\n    if(sy > -40 && sy < H+40) puff(p.x, sy, p.size + p.age*0.55, (1-p.age/2.7)*0.76);\n  }\n\n  // Stage decorations\n  if(stage === 2){\n    const px = 48 + local*220;\n    drawPlane(px, 118, 1);\n    drawPlane(250 - local*140, 148, 0.8);\n  }\n  if(stage === 4){\n    block(34,88,252,2,'#7fb0ff',0.5);\n    block(72,74,9,9,'#cde0ff',0.85);\n    block(250,58,5,5,'#cde0ff',0.8);\n  }\n  // Pixel-art celestial flybys: travel DOWN from above the frame,\n  // hover in view for ~1.5 seconds, then disappear below the frame.\n  // Their timing is independent of the increasing starfield scroll speed.\n  function flybyY(frac, radius){\n    const incoming=0.22, departing=0.77;\n    const upper=-radius-18, middle=120, lower=H+radius+25;\n    const smooth=v=>v*v*(3-2*v);\n    if(frac<incoming) return upper+(middle-upper)*smooth(frac/incoming);\n    if(frac<departing) return middle;\n    return middle+(lower-middle)*smooth((frac-departing)/(1-departing));\n  }\n  if(stage === 5){\n    drawISS(242,flybyY(local,25),1.05);\n  }\n  if(stage === 6){\n    drawMoon(245,flybyY(local,47),2.15);\n  }\n  if(stage === 7){\n    drawMars(248,flybyY(local,43),2.15);\n  }\n  if(stage === 8){\n    drawPluto(249,flybyY(local,33),2.4);\n  }\n  if(stage === 9){\n    // lightspeed streaks\n    for(let i=0;i<34;i++){\n      const x = (i*13 + (t*190)%13) % W;\n      const y = (i*29 + scrollDown*2.6 + x*0.2) % H;\n      block(x, y, 1, 26, i%3===0 ? '#d4e7ff' : '#72a0ff', 0.7);\n    }\n  }\n\n  // Rocket draw\n  const shrink = stage >= 8 ? clamp(1 - (local*0.25), 0.66, 1) : 1;\n  const rw = 35*shrink, rh = 62*shrink;\n  const rx = 160 - rw/2 + (fly>0 ? Math.sin(t*21)*Math.min(1,fly)*0.35 : 0);\n  const ry = rocketScreenY - rh/2;\n\n  // Flame\n  if(rocket.complete && rocket.naturalWidth && mode !== 'exploding' && !(mode==='complete' && destination===0)){\n    if(mode === 'flying' && t > 0.25){\n      const stageBoost = [0.9,1,1,0.92,0.95,0.97,0.95,0.92,0.9,1.25][stage];\n      const flameLength = (22 + Math.sin(t*29)*5 + Math.sin(t*53)*4 + Math.min(fly*7,28)) * shrink * stageBoost;\n      const fy = ry + rh - 2*shrink;\n      block(160-10*shrink, fy, 20*shrink, flameLength+8*shrink, '#e65435', 0.45);\n      block(160-7*shrink, fy, 14*shrink, flameLength, '#ff8c31');\n      block(160-5*shrink, fy, 10*shrink, flameLength*0.83, '#ffc247');\n      block(160-3*shrink, fy, 6*shrink, flameLength*0.68, '#fff2b5');\n      block(160-1.5*shrink, fy, 3*shrink, flameLength*0.42, '#fffef1');\n      if(Math.random() < 0.55){\n        for(let i=0;i<3;i++) sparks.push({x:160+rand(-12,12)*shrink, y:fy+rand(6,flameLength), age:0, vy:rand(26,94), vx:rand(-9,9)});\n      }\n    }\n    ctx.drawImage(rocket, Math.round(rx), Math.round(ry), Math.max(1,Math.round(rw)), Math.max(1,Math.round(rh)));\n  }\n\n  sparks = sparks.filter(p=>p.age<0.48);\n  for(const p of sparks){\n    p.age += dt; p.y += p.vy*dt; p.x += p.vx*dt;\n    block(p.x, p.y, 2, 3, Math.random()>0.5 ? '#ffca51' : '#ff7844', 1-p.age/0.48);\n  }\n\n  // Pixel explosion radiates outward from the rocket in level 0.\n  if(mode==='exploding' || (mode==='complete' && destination===0)){\n    const e=Math.min(explosionTime,1.9);\n    const cx=160,cy=rocketScreenY;\n    const pulse=Math.max(0,1-e/1.5);\n    for(let ring=5;ring>=1;ring--){\n      const radius=(e*28+ring*3)*pulse;\n      if(radius>0){\n        ctx.globalAlpha=pulse*(ring/5);\n        ctx.fillStyle=['#ff6637','#fca43c','#ffe07c','#fff2b9','#ffffff'][ring-1];\n        ctx.fillRect(Math.round(cx-radius),Math.round(cy-radius),Math.round(radius*2),Math.round(radius*2));\n      }\n    }\n    ctx.globalAlpha=1;\n    for(const bit of explosionBits){\n      const radius = bit.velocity*e*(1+e*.4);\n      const x=cx+Math.cos(bit.angle)*radius;\n      const y=cy+Math.sin(bit.angle)*radius+e*e*12;\n      block(x,y,bit.size,bit.size,bit.color,Math.max(0,1-e/2.0));\n    }\n  }\n\n  // HUD readouts\n  const fakeAlt = Math.floor(distance * 4.4);\n  alt.textContent = String(fakeAlt).padStart(4,'0');\n  const boostLevel = [14,24,34,45,56,68,79,87,95,100][stage];\n  boost.style.width = boostLevel + '%';\n\n  // No automatic replay: leave the result on screen until another mission is chosen.\n  requestAnimationFrame(frame);\n}\ntargetInput.value='__ROCKET_SCORE__';\nbegin();\nrequestAnimationFrame(frame);\n})();\n<\/script>\n<\/body>\n<\/html>";

function openVAR() {
  const qNum = prompt("Which question number do you want to review? (1–10)");

  if (!qNum || isNaN(qNum)) return;

  const index = parseInt(qNum) - 1;
  const tile = document.getElementById("tile" + index);

  if (!tile) {
    alert("That tile doesn't exist!");
    return;
  }

  const choice = prompt(
    "VAR Review:\n\n1️⃣ I Misspelled That!\n2️⃣ Nah, I’m Contesting That!\n\nType 1 or 2:"
  );

  if (choice === "1") {
    tile.classList.remove("red", "yellow");
    tile.classList.add("green");
  } else if (choice === "2") {
    tile.classList.remove("green", "red");
    tile.classList.add("yellow");
  }
}

function shareResult() {
  const scoreText = document.getElementById("scoreText").innerText;
  const tiles = document.querySelectorAll(".tile");

  let emojiGrid = "";
  tiles.forEach(tile => {
    if (tile.classList.contains("green")) emojiGrid += "🟩";
    else if (tile.classList.contains("yellow")) emojiGrid += "🟨";
    else emojiGrid += "🟥";
  });

  const shareText =
    `Try Beat Me I Got: ${scoreText}\n` +
    `${emojiGrid}\n` +
    `https://harvic20.github.io/cluesontues.html`;

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(shareText)
      .then(() => {
        const confirmBox = document.getElementById("copyConfirm");
        if (confirmBox) {
          confirmBox.style.display = "block";
          setTimeout(() => confirmBox.style.display = "none", 2000);
        }
      })
      .catch(() => fallbackCopy(shareText));
  } else {
    fallbackCopy(shareText);
  }
}
function fallbackCopy(text) {
  const temp = document.createElement("textarea");
  temp.value = text;
  document.body.appendChild(temp);
  temp.select();
  document.execCommand("copy");
  document.body.removeChild(temp);

  const confirmBox = document.getElementById("copyConfirm");
  if (confirmBox) {
    confirmBox.style.display = "block";
    setTimeout(() => confirmBox.style.display = "none", 2000);
  }
}
let varIndex = null;

function openVAR() {
  const grid = document.getElementById("varQuestionGrid");
  grid.innerHTML = "";

  for (let i = 0; i < 10; i++) {
    const sq = document.createElement("div");
    sq.className = "var-square";
    sq.innerText = i + 1;
    sq.onclick = () => selectVarQuestion(i);
    grid.appendChild(sq);
  }

  document.getElementById("varPopup").style.display = "block";
  document.getElementById("varActions").style.display = "none";
}

function selectVarQuestion(i) {
  varIndex = i;
  document.getElementById("varActions").style.display = "block";
}

function applyVar(type) {
  const tile = document.getElementById("tile" + varIndex);
  const answerRow = document.getElementById("answerRow" + varIndex);

  // Remove previous score for this tile
  if (tile.dataset.score) {
    totalScore -= parseFloat(tile.dataset.score);
  }

  if (type === "misspelled") {
    // Full point
    tile.classList.remove("red", "yellow");
    tile.classList.add("green");

    answerRow.innerHTML = answerRow.innerHTML.replace(/🟥|🟨|🟩/, "🟩");

    tile.dataset.score = "1";
    totalScore += 1;

  } else {
    // Half point
    tile.classList.remove("red", "green");
    tile.classList.add("yellow");

    answerRow.innerHTML = answerRow.innerHTML.replace(/🟥|🟨|🟩/, "🟨");

    tile.dataset.score = "0.5";
    totalScore += 0.5;
  }

  // Update score display
  document.getElementById("scoreText").innerText = totalScore + "/10";
   updateRocketResult();

  // Close mini popup
  document.getElementById("varPopup").style.display = "none";
}

function dropConfetti(score) {
  const container = document.getElementById("confettiContainer");

  for (let i = 0; i < score; i++) {
    const conf = document.createElement("div");
    conf.className = "confetti";
    conf.innerText = score; // ⭐ the number you scored

    // Random horizontal position
    conf.style.left = Math.random() * 100 + "vw";

    // Random animation delay for staggered falling
    conf.style.animationDelay = (Math.random() * 0.5) + "s";

    container.appendChild(conf);

    // Remove after animation
    setTimeout(() => conf.remove(), 2000);
  }
}
