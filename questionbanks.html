<!DOCTYPE html>
<html>
<body>

<button id="btn">Send Test POST</button>

<script>
const URL = "PASTE_YOUR_EXEC_URL_HERE";

document.getElementById("btn").onclick = () => {
  fetch(URL, {
    method: "POST"
  })
  .then(r => r.text())
  .then(t => alert("Response: " + t))
  .catch(err => alert("Error: " + err));
};
</script>

</body>
</html>
