<!DOCTYPE html>
<html>
<body>
 <title>TEST002</title>
<button id="btn">Send Test POST</button>

<script>
const URL = "https://script.google.com/macros/s/AKfycbwCaIZ1J-NNztYqY0P86dpDylPPdUI4z5A_4tNsvyrbTmGRFE3xf1g3dlhuoyZcGlZ_VQ/exec";

document.getElementById("btn").onclick = () => {
  fetch(URL, {
    method: "POST"
  })
  .then(r => r.text())
  .then(t => alert("Response: " + t))
  .catch(err => alert("Error: " + err));
};
</script>

</body>
</html>
