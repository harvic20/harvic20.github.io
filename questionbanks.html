<!DOCTYPE html>
<html>
<body>
 <title>TEST003</title>
<button id="btn">Send Test POST</button>

<script>
const URL = "https://script.google.com/macros/s/AKfycbyASWfW6ml4iR51TTinnzmiYppshbF8-Bkuq5heSe_sTarQndCXOnufbZcmrwfSxtY9UQ/exec";

document.getElementById("btn").onclick = () => {
  fetch(URL, {
    method: "POST"
  })
  .then(r => r.text())
  .then(t => alert("Response: " + t))
  .catch(err => alert("Error: " + err));
};
</script>

</body>
</html>
