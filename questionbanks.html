<script>
  function createQuestionRow(index) {
    const row = document.createElement("div");
    row.className = "row";

    const clue1 = document.createElement("input");
    clue1.placeholder = `Q${index+1} Clue 1`;
    clue1.name = "clue1";

    const clue2 = document.createElement("input");
    clue2.placeholder = `Q${index+1} Clue 2`;
    clue2.name = "clue2";

    const answers = document.createElement("input");
    answers.placeholder = `Q${index+1} Answers (comma separated)`;
    answers.name = "answers";

    row.appendChild(clue1);
    row.appendChild(clue2);
    row.appendChild(answers);

    return row;
  }

  function initQuestions() {
    const container = document.getElementById("questionsContainer");
    for (let i = 0; i < 10; i++) {
      container.appendChild(createQuestionRow(i));
    }
  }

  function getQuestions() {
    const rows = Array.from(document.querySelectorAll("#questionsContainer .row"));
    return rows.map(row => {
      const clue1 = row.querySelector('input[name="clue1"]').value.trim();
      const clue2 = row.querySelector('input[name="clue2"]').value.trim();
      const answersRaw = row.querySelector('input[name="answers"]').value.trim();

      return {
        clue: `${clue1} ${clue2}`.trim(),
        answers: answersRaw ? answersRaw.split(",").map(a => a.trim()) : []
      };
    });
  }

  function generateJSON() {
    const week = document.getElementById("weekInput").value.trim();
    const theme = document.getElementById("themeInput").value.trim();
    const questions = getQuestions();

    const json = {
      week: Number(week),
      theme: theme,
      questions: questions
    };

    document.getElementById("jsonOutput").value =
      JSON.stringify(json, null, 2);
  }

  function downloadJSON() {
    const text = document.getElementById("jsonOutput").value;
    const blob = new Blob([text], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `cluesontues_week${document.getElementById("weekInput").value}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function generateClueList() {
    const week = document.getElementById("weekInput").value.trim();
    const theme = document.getElementById("themeInput").value.trim();
    const questions = getQuestions();

    let output = `CluesOnTues Week ${week}\n`;
    output += `Today's Theme: ${theme}\n\n`;

    questions.forEach((q, i) => {
      output += `${i+1}. ${q.clue}\n`;
    });

    document.getElementById("clueListOutput").value = output;
  }

  // Upload stays the same — uses jsonOutput
  async function uploadJSON() {
    const clientId = document.getElementById("clientIdInput").value.trim();
    const token = document.getElementById("tokenInput").value.trim();
    const jsonText = document.getElementById("jsonOutput").value;

    if (!clientId || !token) {
      alert("Please paste your Client ID and Access Token.");
      return;
    }

    const metadata = {
      name: `cluesontues_week${document.getElementById("weekInput").value}.json`,
      mimeType: "application/json"
    };

    const form = new FormData();
    form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
    form.append("file", new Blob([jsonText], { type: "application/json" }));

    const res = await fetch(
      "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",
      {
        method: "POST",
        headers: {
          Authorization: `Bearer ${token}`
        },
        body: form
      }
    );

    if (res.ok) {
      alert("Uploaded successfully!");
    } else {
      alert("Upload failed. Check your token.");
    }
  }

  document.getElementById("generateJsonBtn").addEventListener("click", generateJSON);
  document.getElementById("downloadJsonBtn").addEventListener("click", downloadJSON);
  document.getElementById("generateClueListBtn").addEventListener("click", generateClueList);
  document.getElementById("uploadJsonBtn").addEventListener("click", uploadJSON);

  initQuestions();
</script>
