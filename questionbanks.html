<!DOCTYPE html>
<html>
<body>
 <title>TEST001</title>
<button id="btn">Send Test POST</button>

<script>
const URL = "https://script.google.com/macros/s/AKfycbzRrwvO_i7E6PVlHAykg_As_w5tM-MAUQw_5HmDsf0TgdxdRFPpuRJFTpCqr4s6Imb2EA/exec";

document.getElementById("btn").onclick = () => {
  fetch(URL, {
    method: "POST"
  })
  .then(r => r.text())
  .then(t => alert("Response: " + t))
  .catch(err => alert("Error: " + err));
};
</script>

</body>
</html>
