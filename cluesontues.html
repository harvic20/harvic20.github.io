<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clues on Tues Quiz00000000</title>

  <style>
    #correctAnswers p {
  margin: 3px 0;      /* MUCH tighter */
  line-height: 1.2;   /* optional: reduces vertical height */
  font-size: 1.2rem;  /* optional: slightly smaller text */
}
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f5f9ff;
      margin: 0;
      
      padding: 0;
      opacity: 0;
      animation: fadeInBody 0.8s ease forwards;
    }
    #confettiContainer {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: hidden;
      z-index: 9999; 
}

.confetti {
  position: absolute;
  font-size: 2rem;
  animation: fall 1.5s linear forwards;
  opacity: 0.9;
}

@keyframes fall {
  0% {
    transform: translateY(-50px) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translateY(100vh) rotate(360deg);
    opacity: 0;
  }
}

@media (max-width: 600px) {
  .container {
    width: 92%;
    padding: 20px;
    margin: 20px auto;
  }

  h1 {
    font-size: 1.6rem;
  }

  input[type="text"] {
    width: 100%;
    font-size: 0.95rem;
    padding: 8px;
  }

  button {
    font-size: 1rem;
    padding: 12px;
  }

  .tile {
    width: 28px;
    height: 28px;
    font-size: 0.9rem;
  }
    button[type="submit"] {
    font-size: 0.92rem;
    padding: 10px 12px;
    width: 100%;
  }
}

    @keyframes fadeInBody {
      from { opacity: 0; }
      to { opacity: 1; }
    }

.container {
  max-width: 700px;
  width: 95%;              /* scales beautifully on phones */
  margin: 30px auto;
  background: white;
  padding: 20px;           /* smaller padding on mobile */
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  animation: fadeSlideIn 0.8s ease forwards;
  opacity: 0;
  transform: translateY(20px);
}

    @keyframes fadeSlideIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      text-align: center;
      color: #0a4dbf;
      margin-bottom: 30px;
      font-size: 2rem;
      letter-spacing: 1px;
      animation: fadeInHeader 1s ease forwards;
      opacity: 0;
    }

    @keyframes fadeInHeader {
      to { opacity: 1; }
    }

    .question {
      margin-bottom: 25px;
      opacity: 0;
      transform: translateY(15px);
      animation: questionSlideIn 0.6s ease forwards;
    }

    .question:nth-child(1) { animation-delay: 0.2s; }
    .question:nth-child(2) { animation-delay: 0.3s; }
    .question:nth-child(3) { animation-delay: 0.4s; }
    .question:nth-child(4) { animation-delay: 0.5s; }
    .question:nth-child(5) { animation-delay: 0.6s; }
    .question:nth-child(6) { animation-delay: 0.7s; }
    .question:nth-child(7) { animation-delay: 0.8s; }
    .question:nth-child(8) { animation-delay: 0.9s; }
    .question:nth-child(9) { animation-delay: 1.0s; }
    .question:nth-child(10) { animation-delay: 1.1s; }

    @keyframes questionSlideIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    input[type="text"] {
      width: 95%;
      padding: 12px;
      font-size: 1rem;
      border: 2px solid #dce6ff;
      border-radius: 8px;
      transition: 0.25s;
    }

    input[type="text"]:focus {
      border-color: #0a4dbf;
      outline: none;
      box-shadow: 0 0 8px rgba(10,77,191,0.3);
      transform: scale(1.02);
    }

    button {
      width: 100%;
      padding: 14px;
      background: #0a4dbf;
      color: white;
      font-size: 1.1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
      transition: 0.25s;
      animation: fadeInButton 1.2s ease forwards;
      opacity: 0;
    }

    @keyframes fadeInButton {
      to { opacity: 1; }
    }

    button:hover {
      background: #083a8f;
      box-shadow: 0 0 10px rgba(10,77,191,0.4);
      transform: scale(1.03);
    }

    /* POPUP OVERLAY */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.45);
      display: none;
      justify-content: center;
      align-items: center;
      animation: fadeInOverlay 0.3s ease forwards;
    }

    @keyframes fadeInOverlay {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* POPUP BOX */
.popup {
  background: white;
  padding: 10px 10px;       /* tighter padding */
  width: 90%;
  max-width: 350px;
  border-radius: 10px;
  text-align: center;
  box-shadow: 0 6px 25px rgba(0,0,0,0.2);
    overflow-y: auto;
  max-height: 80vh;
}
.tile.yellow {
  background: #fbc02d; /* VAR yellow */
}




    @keyframes popupIn {
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .tiles {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 2px;
      margin: 14px auto;
      max-width: 250px;
    }

    .tile {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      background: #dce6ff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      color: white;
      font-size: 1.1rem;
      animation: tilePop 0.3s ease;
    }

    @keyframes tilePop {
      from { transform: scale(0.6); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .tile.green { background: #4caf50; }
    .tile.red { background: #e53935; }

.close-btn {
  display: block;
  width: 100%;
  margin: 6px 0;        /* was likely 15–20px */
  padding: 6px 0;      /* keeps button height comfortable */
  background-color: #3b4edc;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
    .var-popup {
  background: white;
  padding: 12px;
  border-radius: 10px;
  text-align: center;
  margin-top: 10px;
  border: 2px solid #0a4dbf;
}

.var-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  margin-top: 10px;
}

.var-square {
  background: #e3e3e3;
  padding: 6px 0;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.2s;
}

.var-square:hover {
  background: #cfcfcf;
}


    .close-btn:hover {
      background: #083a8f;
    }

  </style>
</head>

<body>
  <div class="container">
<img src="logo.png" alt="CluesOnTues Logo"
     style="max-width:100%; height:auto; display:block; margin:0 auto 20px auto;">



    <form id="quizForm">
      <h2 id="themeTitle" style="text-align:center; color:#0a4dbf; margin-bottom:20px;"></h2>

    <div id="questionsContainer"></div>

      <button type="submit">Submit Answers</button>
    </form>
  </div>
<div id="confettiContainer"></div>
  <!-- POPUP -->
  <div class="overlay" id="overlay">
    <div class="popup">
      <h2>Your Score</h2>
      <p id="scoreText"></p>

      <div class="tiles" id="tiles"></div>
      <div id="correctAnswers" style="margin-top:8px; text-align:left;"></div>
<div id="varPopup" class="var-popup" style="display:none;">
  <h3>VAR Review</h3>
  <p>Select a question:</p>
  <div id="varQuestionGrid" class="var-grid"></div>

  <div id="varActions" style="display:none; margin-top:10px;">
    <button class="close-btn" onclick="applyVar('misspelled')">I Misspelled That!</button>
    <button class="close-btn" onclick="applyVar('contested')">I’m Contesting That!</button>
  </div>
</div>


      <button class="close-btn" onclick="openVAR()">VAR</button>
<button class="close-btn" onclick="shareResult()">Share Result</button>
<button class="close-btn" onclick="closePopup()">Close</button>
<p id="copyConfirm" style="display:none; margin-top:6px; color:#0a4dbf; font-weight:bold;">
  Copied to clipboard!
</p>


    </div>
  </div>

<script>
  let totalScore = 0;
  let quizSubmitted = false;
 // Load questions when page loads
fetch("questions.json")
  .then(response => response.json())
  .then(data => {

    document.getElementById("themeTitle").innerText =
      `CluesOnTues #${data.week} — ${data.theme}`;

    const questions = data.questions;
    // Build questions
    const container = document.getElementById("questionsContainer");
    questions.forEach((q, index) => {
      const div = document.createElement("div");
      div.className = "question";
      div.innerHTML = `
        <p>${index + 1}. ${q.clue}</p>
        <input type="text" name="q${index}">
      `;
      container.appendChild(div);
    });

    // Handle submit
    document.getElementById("quizForm").addEventListener("submit", function(e) {
      e.preventDefault();

      
  if (quizSubmitted) {
    // ⭐ Already submitted → just reopen popup
    document.getElementById("overlay").style.display = "flex";
    return;
  }

  quizSubmitted = true; // ⭐ First time only
let results = [];

questions.forEach((q, index) => {
  const input = document.querySelector(`input[name="q${index}"]`);
  const userAnswer = input.value.trim().toLowerCase();

  // ⭐ Normalise to an array of answers
  const answerList = Array.isArray(q.answers)
    ? q.answers
    : [q.answer]; // fallback for old JSON

  const correct = answerList.some(a => userAnswer === a.toLowerCase());

  input.disabled = true;
  input.style.backgroundColor = correct ? "#b6ffb6" : "#ffb6b6";

  if (correct) totalScore++;

  const mainAnswer = answerList[0];

  const answerReveal = document.createElement("p");
  answerReveal.className = "correct-answer-text";
  answerReveal.innerHTML = `Correct Answer: <strong>${mainAnswer}</strong>`;
  answerReveal.style.margin = "4px 0 10px 0";
  answerReveal.style.color = correct ? "#0a4dbf" : "#d00000";

  input.parentNode.appendChild(answerReveal);
});



      
      document.getElementById("scoreText").innerText = totalScore + "/" + questions.length;
      dropConfetti(totalScore);

      const tiles = document.getElementById("tiles");
      tiles.innerHTML = "";

results.forEach((correct, index) => {
  const tileGroup = document.createElement("div");
  tileGroup.style.display = "flex";
  tileGroup.style.flexDirection = "column";
  tileGroup.style.alignItems = "center";
  tileGroup.style.margin = "2px";

  const tile = document.createElement("div");
  tile.className = "tile " + (correct ? "green" : "red");
  tile.style.animationDelay = (index * 0.05) + "s";
  tile.id = "tile" + index;

  // ⭐ Store the score for VAR
  tile.dataset.score = correct ? "1" : "0";

  tileGroup.appendChild(tile);
  tiles.appendChild(tileGroup);
});


const answersBox = document.getElementById("correctAnswers");
answersBox.innerHTML = "<h3>Correct Answers:</h3>";

questions.forEach((q, index) => {

  // Normalise answers
  const answerList = Array.isArray(q.answers)
    ? q.answers
    : [q.answer];

  const parts = q.clue.split(" ");
  const clue1 = parts[0];
  const clue2 = parts[1];

  answersBox.innerHTML += `
    <p id="answerRow${index}">
      🟥 <strong>${index + 1}.</strong>
      ${clue1} + ${clue2} = <strong>${answerList[0]}</strong>
    </p>
  `;
});


      document.getElementById("overlay").style.display = "flex";
    });

  });
  console.log("1");
function openVAR() {
  const qNum = prompt("Which question number do you want to review? (1–10)");

  if (!qNum || isNaN(qNum)) return;

  const index = parseInt(qNum) - 1;
  const tile = document.getElementById("tile" + index);

  if (!tile) {
    alert("That tile doesn't exist!");
    return;
  }

  const choice = prompt(
    "VAR Review:\n\n1️⃣ I Misspelled That!\n2️⃣ Nah, I’m Contesting That!\n\nType 1 or 2:"
  );

  if (choice === "1") {
    tile.classList.remove("red", "yellow");
    tile.classList.add("green");
  } else if (choice === "2") {
    tile.classList.remove("green", "red");
    tile.classList.add("yellow");
  }
}
  function closePopup() {
  const overlay = document.getElementById("overlay");
  if (overlay) {
    overlay.style.display = "none";
  }
}
function shareResult() {
  const scoreText = document.getElementById("scoreText").innerText;
  const tiles = document.querySelectorAll(".tile");

  let emojiGrid = "";
  tiles.forEach(tile => {
    if (tile.classList.contains("green")) emojiGrid += "🟩";
    else if (tile.classList.contains("yellow")) emojiGrid += "🟨";
    else emojiGrid += "🟥";
  });

  const shareText =
    `Try Beat Me I Got: ${scoreText}\n` +
    `${emojiGrid}\n` +
    `https://harvic20.github.io/cluesontues.html`;

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(shareText)
      .then(() => {
        const confirmBox = document.getElementById("copyConfirm");
        if (confirmBox) {
          confirmBox.style.display = "block";
          setTimeout(() => confirmBox.style.display = "none", 2000);
        }
      })
      .catch(() => fallbackCopy(shareText));
  } else {
    fallbackCopy(shareText);
  }
}
function fallbackCopy(text) {
  const temp = document.createElement("textarea");
  temp.value = text;
  document.body.appendChild(temp);
  temp.select();
  document.execCommand("copy");
  document.body.removeChild(temp);

  const confirmBox = document.getElementById("copyConfirm");
  if (confirmBox) {
    confirmBox.style.display = "block";
    setTimeout(() => confirmBox.style.display = "none", 2000);
  }
}
let varIndex = null;

function openVAR() {
  const grid = document.getElementById("varQuestionGrid");
  grid.innerHTML = "";

  for (let i = 0; i < 10; i++) {
    const sq = document.createElement("div");
    sq.className = "var-square";
    sq.innerText = i + 1;
    sq.onclick = () => selectVarQuestion(i);
    grid.appendChild(sq);
  }

  document.getElementById("varPopup").style.display = "block";
  document.getElementById("varActions").style.display = "none";
}

function selectVarQuestion(i) {
  varIndex = i;
  document.getElementById("varActions").style.display = "block";
}

function applyVar(type) {
  const tile = document.getElementById("tile" + varIndex);
  const answerRow = document.getElementById("answerRow" + varIndex);

  // Remove previous score for this tile
  if (tile.dataset.score) {
    totalScore -= parseFloat(tile.dataset.score);
  }

  if (type === "misspelled") {
    // Full point
    tile.classList.remove("red", "yellow");
    tile.classList.add("green");

    answerRow.innerHTML = answerRow.innerHTML.replace(/🟥|🟨|🟩/, "🟩");

    tile.dataset.score = "1";
    totalScore += 1;

  } else {
    // Half point
    tile.classList.remove("red", "green");
    tile.classList.add("yellow");

    answerRow.innerHTML = answerRow.innerHTML.replace(/🟥|🟨|🟩/, "🟨");

    tile.dataset.score = "0.5";
    totalScore += 0.5;
  }

  // Update score display
  document.getElementById("scoreText").innerText = totalScore.toString();

  // Close mini popup
  document.getElementById("varPopup").style.display = "none";
}

function dropConfetti(score) {
  const container = document.getElementById("confettiContainer");

  for (let i = 0; i < score; i++) {
    const conf = document.createElement("div");
    conf.className = "confetti";
    conf.innerText = score; // ⭐ the number you scored

    // Random horizontal position
    conf.style.left = Math.random() * 100 + "vw";

    // Random animation delay for staggered falling
    conf.style.animationDelay = (Math.random() * 0.5) + "s";

    container.appendChild(conf);

    // Remove after animation
    setTimeout(() => conf.remove(), 2000);
  }
}

</script>
    </body>
